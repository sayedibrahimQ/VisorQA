name: VisorQA PR Guard

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/*.tsx'
      - '**/*.jsx'
      - '**/*.css'
      - '**/tailwind.config.*'
  workflow_dispatch:

jobs:
  guard:
    name: VisorQA Autonomous PR Visual Guard
    if: "!startsWith(github.event.head_commit.message, 'fix(visorqa):') && github.actor != 'visorqa-bot[bot]'"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: visorqa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/visorqa_test
      PYTHONPATH: .
      GITHUB_WEBHOOK_SECRET: test_webhook_secret_key_12345

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-asyncio httpx

      - name: Run VisorQA Webhook & PR Guard Smoke Verification
        run: |
          pytest tests/e2e/test_github_webhooks.py -v

