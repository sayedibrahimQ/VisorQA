name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    name: Backend Lint & Unit Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: visorqa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/visorqa_test
      PYTHONPATH: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install -r backend/requirements.txt pytest pytest-asyncio ruff

      - name: Run Ruff Lint Check
        run: ruff check backend/

      - name: Run Deterministic Unit Tests
        run: pytest backend/tests/ -v
