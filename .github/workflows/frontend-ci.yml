name: Frontend CI

on:
  push:
    paths:
      - 'frontend/**'
      - 'demo-target-app/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'demo-target-app/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend Dependencies & Verification
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

      - name: Demo Target App Verification (Conditional)
        if: hashFiles('demo-target-app/package.json') != ''
        working-directory: demo-target-app
        run: |
          npm ci
          if npm run | grep -q "build"; then
            npm run build
          fi

