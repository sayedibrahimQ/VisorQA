version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: visorqa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: visorqa
      POSTGRES_PASSWORD: visorqa
      POSTGRES_DB: visorqa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visorqa -d visorqa"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
